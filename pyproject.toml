[project]
name = "stock-news-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.136.3",
    "jupyter>=1.1.1",
    "langchain>=1.3.2",
    "langchain-google-genai>=4.2.4",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.2",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.3.15",
    "langserve>=0.3.3",
    "langsmith>=0.8.8",
    "notebook>=7.5.6",
    "pydantic>=2.13.4",
    "sse-starlette>=3.4.4",
    "supabase>=2.30.1",
    "tavily>=1.1.0",
    "uvicorn>=0.49.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyinstaller>=6.20.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

#--- Ruff: linter ----------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["notebooks", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports, undefined names
    "I",    # isort: import ordering
    "B",    # flake8-bugbear: likely bugs
    "UP",   # pyupgrade: modern Python syntax
]
ignore = [
    "E501", # line length: long prompt strings; revisit if we adopt `ruff format`
]

[tool.ruff.lint.isort]
known-first-party = ["agent"]


# ── mypy: type checker ───────────────────────────────────────
[tool.mypy]
python_version = "3.13"
files = ["agent", "main.py", "tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Tighten toward `strict = true` after the DI refactor.

# Third-party packages without type information.
# Add a module here only when mypy reports it, with the reason.
# [[tool.mypy.overrides]]
# module = ["yfinance.*"]
# ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that call external services (not run in CI by default)",
]